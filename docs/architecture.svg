    <text x="16" y="46" fill="#F1F5F9" font-size="13" font-weight="600">Goal: Voice / Natural Language</text>
    <text x="16" y="64" fill="#64748B" font-size="11">e.g. "Wireless ANC headphones &lt; ₹3,000"</text>

