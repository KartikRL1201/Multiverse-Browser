<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" width="100%" height="100%" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;">
  <defs>
    <pattern id="light-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#E2E8F0" />
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#light-grid)" />

  <!-- Title Header -->
  <g transform="translate(48, 42)">
    <text x="0" y="0" fill="#0F172A" font-size="19" font-weight="800" letter-spacing="-0.5">MULTIVERSE BROWSER · DYNAMIC N-UNIVERSE ARCHITECTURE</text>
    <text x="0" y="20" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="500">wHACKiest 2026 // Track 2: Beyond the Browser // General Web Goals: Shopping, Plans, Travel, Medicines &amp; Opportunities</text>
  </g>

  <!-- 1. INTENT & DYNAMIC PLANNER LAYER -->
  <g transform="translate(48, 90)">
    <rect width="260" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="16" y="24" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">01 // ANY WEB GOAL</text>
    <text x="16" y="46" fill="#0F172A" font-size="13" font-weight="700">Voice or Text Intent</text>
    <text x="16" y="65" fill="#64748B" font-size="10.5">Trips, scholarships, plans, meds, gear</text>

    <path d="M 260 43 L 305 43" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

    <g transform="translate(305, 0)">
      <rect width="270" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#2563EB" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">SPONSOR // ELEVENLABS SCRIBE</text>
      <text x="16" y="46" fill="#0F172A" font-size="13" font-weight="700">Multilingual Realtime STT</text>
      <text x="16" y="65" fill="#64748B" font-size="10.5">&lt;150ms latency · 90+ languages</text>
    </g>

    <path d="M 575 43 L 620 43" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

    <g transform="translate(620, 0)">
      <rect width="404" height="86" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#7C3AED" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">DYNAMIC PLANNER // AWS BEDROCK</text>
      <text x="16" y="46" fill="#0F172A" font-size="13" font-weight="700">Dynamically Decides N Universes</text>
      <text x="16" y="65" fill="#64748B" font-size="10.5">Sizes swarm (2–6+ workers) &amp; assigns distinct strategies per goal</text>
    </g>
  </g>

  <path d="M 822 176 L 822 206 L 560 206 L 560 226" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-slate)" />

  <!-- 2. DYNAMIC PARALLEL AGENT SWARM -->
  <g transform="translate(48, 226)">
    <rect width="1024" height="198" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="20" y="24" fill="#64748B" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">N PARALLEL ISOLATED BROWSER UNIVERSES // PLAYWRIGHT CHROMIUM / AGENTCORE (READ-ONLY ENFORCED)</text>

    <!-- Dynamic Worker 1 -->
    <g transform="translate(20, 40)">
      <rect width="230" height="140" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="14" y="24" fill="#059669" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">UNIVERSE 1 // TRUE COST</text>
      <text x="14" y="46" fill="#0F172A" font-size="12" font-weight="700">Checkout &amp; Fee Auditor</text>
      <text x="14" y="66" fill="#64748B" font-size="10">Drills to final fare / checkout</text>
      <text x="14" y="82" fill="#64748B" font-size="10">Uncovers baggage &amp; drip fees</text>
      <rect x="14" y="98" width="202" height="26" rx="6" fill="#FFF1F2" stroke="#FECDD3" />
      <text x="22" y="115" fill="#E11D48" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600">Catches: Drip Fees / Renewals</text>
    </g>

    <!-- Dynamic Worker 2 -->
    <g transform="translate(268, 40)">
      <rect width="230" height="140" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="14" y="24" fill="#D97706" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">UNIVERSE 2 // ALTERNATIVES</text>
      <text x="14" y="46" fill="#0F172A" font-size="12" font-weight="700">Alt Mode / Generic / Path</text>
      <text x="14" y="66" fill="#64748B" font-size="10">Train vs flight, refurb vs new,</text>
      <text x="14" y="82" fill="#64748B" font-size="10">Jan Aushadhi salt match, OCW</text>
      <rect x="14" y="98" width="202" height="26" rx="6" fill="#FFFBEB" stroke="#FDE68A" />
      <text x="22" y="115" fill="#D97706" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600">Finds non-obvious options</text>
    </g>

    <!-- Dynamic Worker 3 -->
    <g transform="translate(516, 40)">
      <rect width="230" height="140" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="14" y="24" fill="#2563EB" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">UNIVERSE 3 // FINE PRINT</text>
      <text x="14" y="46" fill="#0F172A" font-size="12" font-weight="700">Eligibility, Deadlines &amp; Traps</text>
      <text x="14" y="66" fill="#64748B" font-size="10">Checks bonds, income caps,</text>
      <text x="14" y="82" fill="#64748B" font-size="10">lock-ins &amp; refund rules</text>
      <rect x="14" y="98" width="202" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="22" y="115" fill="#2563EB" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600">Prunes ineligible dead-ends</text>
    </g>

    <!-- Dynamic Worker N -->
    <g transform="translate(764, 40)">
      <rect width="240" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#card-shadow)" />
      <text x="14" y="24" fill="#7C3AED" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">UNIVERSE 4..N // DYNAMIC</text>
      <text x="14" y="46" fill="#0F172A" font-size="12" font-weight="700">Perks, Value &amp; Constraints</text>
      <text x="14" y="66" fill="#64748B" font-size="10">Spawned dynamically when goal</text>
      <text x="14" y="82" fill="#64748B" font-size="10">has extra axes (vouchers, safety)</text>
      <rect x="14" y="98" width="212" height="26" rx="6" fill="#F5F3FF" stroke="#DDD6FE" />
      <text x="22" y="115" fill="#7C3AED" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600">Adapts count N to task scope</text>
    </g>
  </g>

  <path d="M 290 424 L 290 458" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M 530 424 L 530 458" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- 3. SHARED BLACKBOARD & RECEIPT STORE -->
  <g transform="translate(48, 458)">
    <rect width="520" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="18" y="24" fill="#D97706" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">SHARED BLACKBOARD BUS // CROSS-UNIVERSE STATE SYNC</text>
    <text x="18" y="46" fill="#0F172A" font-size="12" font-weight="700">Live Discoveries: Vouchers · Fine-Print Traps · Eligibility · Dead Ends</text>
    <text x="18" y="66" fill="#64748B" font-size="11">Any discovery posted by one universe immediately updates peer strategies live</text>

    <g transform="translate(540, 0)">
      <rect width="484" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="18" y="24" fill="#2563EB" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">SPONSOR // AWS S3 RECEIPT &amp; SCREENSHOT STORE</text>
      <text x="18" y="46" fill="#0F172A" font-size="12" font-weight="700">Playwright Screenshot Receipts &amp; DOM Snapshots</text>
      <text x="18" y="66" fill="#64748B" font-size="11">Verifiable visual proof for every fee, deadline, coupon, and catch</text>
    </g>
  </g>

  <path d="M 308 544 L 308 578" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <path d="M 782 544 L 782 578" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <!-- 4. VERDICT & AUDIT SYNTHESIS -->
  <g transform="translate(48, 578)">
    <rect width="460" height="82" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="18" y="22" fill="#7C3AED" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="0.5">MULTIVERSE JUDGE // BEDROCK SYNTHESIS</text>
    <text x="18" y="44" fill="#0F172A" font-size="13" font-weight="700">Domain-Aware Verdict &amp; Catch Report</text>
    <text x="18" y="62" fill="#059669" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600">Merges all N surviving universes with screenshot proof</text>

    <g transform="translate(480, 0)">
      <rect width="280" height="82" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="16" y="22" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">FRONTEND INTERACTION</text>
      <text x="16" y="44" fill="#0F172A" font-size="12" font-weight="700">Dynamic Swarm Control Board</text>
      <text x="16" y="62" fill="#64748B" font-size="11">WebSockets · Live Playwright frames</text>
    </g>

    <g transform="translate(780, 0)">
      <rect width="244" height="82" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <text x="16" y="22" fill="#059669" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700">SPONSOR // ELEVENLABS</text>
      <text x="16" y="44" fill="#0F172A" font-size="12" font-weight="700">Spoken Verdict TTS</text>
      <text x="16" y="62" fill="#64748B" font-size="11">Natural regional voice summary</text>
    </g>
  </g>
</svg>
